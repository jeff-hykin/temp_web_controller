# Builds web_ctrl for the three platforms dtk knows how to fetch, and keeps a
# release tagged `latest` pointing at them, so
# https://github.com/jeff-hykin/temp_web_controller/releases/latest/download/web_ctrl-<platform>
# is always the newest build of main.
name: release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@main
            - uses: DeterminateSystems/magic-nix-cache-action@main
            # Both are static musl, so they depend on nothing on the target.
            - run: nix build .#linux-x86 --print-build-logs
            - run: install -m755 result/bin/web_ctrl web_ctrl-x86_64-linux
            - run: nix build .#linux-arm64 --print-build-logs
            - run: install -m755 result/bin/web_ctrl web_ctrl-aarch64-linux
            - uses: actions/upload-artifact@v4
              with:
                  name: linux
                  path: web_ctrl-*-linux

    macos:
        # apple silicon
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            # nix would work here too, but a nix-built mac binary links against
            # /nix/store dylibs and will not run on a Mac without nix.
            - run: cargo build --release --locked
            - run: install -m755 target/release/web_ctrl web_ctrl-aarch64-macos
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: web_ctrl-aarch64-macos

    release:
        needs: [linux, macos]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  merge-multiple: true
                  path: dist
            - name: publish the `latest` release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release delete latest --yes --cleanup-tag || true
                  gh release create latest dist/* \
                      --title "latest" \
                      --notes "Built from ${{ github.sha }}"
