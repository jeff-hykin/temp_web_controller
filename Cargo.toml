[package]
name = "web_ctrl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "web_ctrl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
image-webp = "0.2.4"
jpeg-encoder = "0.6"
mcap = { version = "0.25.0", default-features = false, features = ["lz4", "zstd"] }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# zenoh-web pins 1.6.2 (1.7.0-1.10.1 deadlock answering the admin space); its types cross our API
zenoh = { version = "=1.6.2", features = ["unstable"] }
# not on crates.io; pinned, and web/vendor/zenoh_web.js is bundled from these same revs (run/vendor_zenoh_web)
zenoh-web = { git = "https://github.com/jeff-hykin/zenoh-web", rev = "d1d0f27a1a6f755def9259a9c541a09241eafae8" }
zenoh-dimos-codecs = { git = "https://github.com/jeff-hykin/zenoh-dimos-codecs", rev = "236fdf5513302880a4a844a680cc475c91dcf96c" }
zune-core = "0.5.3"
zune-jpegxl = "0.5.2"

[profile.release]
opt-level = 3
lto = "thin"

[dev-dependencies]
jxl-oxide = { version = "0.12.6", default-features = false }
