[package]
name = "web_ctrl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "web_ctrl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
jpeg-encoder = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
zenoh = { version = "1", features = ["unstable"] }

[profile.release]
opt-level = 3
lto = "thin"
